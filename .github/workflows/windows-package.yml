name: Package Cally for Windows
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build Windows x64 installer
        shell: pwsh
        run: |
          $version = "1.$([math]::Floor($env:GITHUB_RUN_NUMBER / 65535)).$($env:GITHUB_RUN_NUMBER % 65535)"
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP/wix"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet publish Cally.csproj -c Release -r win-x64 --self-contained true -p:Version=$version -p:DebugType=None -p:DebugSymbols=false -o artifacts/publish
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/wix/wix.exe" build installer/Cally.wxs -arch x64 -d Version=$version -d "PublishDir=$pwd/artifacts/publish" -d "IconPath=$pwd/Assets/Cally.ico" -o artifacts/Cally-win-x64.msi
      - name: Save installer
        uses: actions/upload-artifact@v4
        with:
          name: Cally-windows-installer
          path: artifacts/Cally-win-x64.msi
          if-no-files-found: error

  release:
    needs: package
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cally-windows-installer
      - name: Publish installer to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v1.$((GITHUB_RUN_NUMBER / 65535)).$((GITHUB_RUN_NUMBER % 65535))"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" Cally-win-x64.msi --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" Cally-win-x64.msi --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Cally $tag" --notes "Download and run Cally-win-x64.msi to install Cally on Windows x64."
          fi
